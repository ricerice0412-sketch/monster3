<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monster 3 AR</title>
  <!-- Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#000;}
    model-viewer{width:100%;height:100%;}
    .hint{position:fixed;left:12px;bottom:12px;color:#fff;font:14px/1.3 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;opacity:.8}
  </style>
  <meta name="theme-color" content="#000"/>
</head>
<body>
  <model-viewer
    src="./m3.glb"
    <!-- 若以后有 iPhone 的 USDZ，可去掉下一行注释并把文件放同层 -->
    <!-- ios-src="./m3.usdz" -->
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral">
  </model-viewer>

  <div class="hint">📱 iPhone 用 Safari ｜ 🤖 Android 用 Chrome</div>
</body>
</html>
